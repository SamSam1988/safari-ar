<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>🦒 Safari AR Adventure</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#000; overflow:hidden; font-family:'Fredoka One',sans-serif; touch-action:none; }

/* ── VIDEO BG ── */
#videoBg {
  position:fixed; inset:0; width:100%; height:100%;
  object-fit:cover; z-index:0;
}
#noCamBg {
  position:fixed; inset:0; z-index:0;
  background: linear-gradient(160deg,#0f2027,#203a43,#2c5364);
  display:none;
}

/* ── CANVAS over video ── */
#gameCanvas {
  position:fixed; inset:0; width:100%; height:100%;
  z-index:1; background:transparent;
}

/* ── CARDBOARD VR mode: split video into two eyes ── */
body.vr-mode #videoBg { display:none; }
#vrLeft, #vrRight {
  display:none; position:fixed; top:0; width:50%; height:100%;
  overflow:hidden; z-index:0;
}
#vrLeft  { left:0; }
#vrRight { right:0; }
#vrLeft  video, #vrRight video { width:200%; height:100%; object-fit:cover; }
#vrLeft  video { margin-left:0; }
#vrRight video { margin-left:-100%; }
body.vr-mode #vrLeft,
body.vr-mode #vrRight { display:block; }
body.vr-mode #gameCanvas { z-index:1; }

/* ── VR divider line ── */
#vrDivider {
  display:none; position:fixed; left:50%; top:0; bottom:0;
  width:4px; background:#000; z-index:9; transform:translateX(-50%);
}
body.vr-mode #vrDivider { display:block; }

/* ── LOADING ── */
#loading {
  position:fixed; inset:0;
  background:linear-gradient(135deg,#1a1a2e,#16213e,#0f3460);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  z-index:200; color:#fff; text-align:center; padding:2rem;
}
#loading .critters { font-size:3.5rem; margin-bottom:1rem; animation:hop 1.2s infinite; }
@keyframes hop { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-12px)} }
#loading h1 { font-size:2.8rem; color:#ffd54f; text-shadow:0 0 24px rgba(255,200,0,.8); margin-bottom:.4rem; }
#loading p  { font-size:1rem; color:#aad4f5; line-height:1.6; max-width:300px; margin:.4rem auto; }
#startBtn {
  margin-top:1.5rem; background:linear-gradient(135deg,#f9a825,#e65100);
  border:none; border-radius:50px; padding:1rem 2.5rem;
  font-size:1.4rem; font-family:'Fredoka One',sans-serif;
  color:#fff; cursor:pointer;
  animation:pulse 2s infinite;
}
@keyframes pulse {
  0%,100%{transform:scale(1); box-shadow:0 4px 20px rgba(249,168,37,.5)}
  50%{transform:scale(1.05); box-shadow:0 4px 30px rgba(249,168,37,.9)}
}

/* ── HUD ── */
#hud {
  position:fixed; top:0; left:0; right:0; z-index:10;
  padding:.8rem 1rem; display:flex; justify-content:space-between; align-items:flex-start;
  pointer-events:none;
}
.hud-pill {
  background:rgba(0,0,0,.65); border-radius:20px; padding:.4rem .9rem;
  color:#fff; font-size:1rem; border:1.5px solid rgba(255,220,0,.5);
  backdrop-filter:blur(6px);
}
#found-box { color:#7ef; border-color:rgba(100,220,255,.4); max-width:55vw; text-align:right; }

/* ── BOTTOM BAR ── */
#bottomBar {
  position:fixed; bottom:0; left:0; right:0; z-index:10;
  padding:.7rem 1rem 1.2rem; display:flex;
  align-items:center; justify-content:space-between; gap:.5rem;
  background:rgba(0,0,0,.5); backdrop-filter:blur(8px);
  border-top:1px solid rgba(255,255,255,.1);
}
#hint-text {
  flex:1; color:#fff; font-size:.92rem; text-align:center; line-height:1.3;
}
#catchBtn {
  background:linear-gradient(135deg,#43a047,#1b5e20);
  border:none; border-radius:50px; padding:.7rem 1.4rem;
  font-size:1.1rem; font-family:'Fredoka One',sans-serif;
  color:#fff; cursor:pointer; white-space:nowrap;
  box-shadow:0 3px 16px rgba(67,160,71,.6); display:none; pointer-events:all;
}
#vrBtn {
  background:rgba(255,255,255,.12); border:1.5px solid rgba(255,255,255,.35);
  border-radius:50px; padding:.55rem 1rem;
  font-size:1rem; font-family:'Fredoka One',sans-serif;
  color:#fff; cursor:pointer; white-space:nowrap; pointer-events:all;
  flex-shrink:0;
}
#vrBtn:active { background:rgba(255,255,255,.25); }

/* ── CATCH POPUP ── */
#popup {
  position:fixed; inset:0; display:none; align-items:center; justify-content:center;
  z-index:50; background:rgba(0,0,0,.55);
}
#popup-inner {
  background:linear-gradient(135deg,#1a237e,#283593);
  border-radius:24px; padding:2rem 1.5rem; text-align:center; color:#fff;
  border:3px solid rgba(255,200,0,.7); max-width:300px; width:88vw;
}
#popup-emoji { font-size:5rem; }
#popup-name  { font-size:2rem; color:#ffd54f; margin:.3rem 0; }
#popup-msg   { font-size:.95rem; color:#b3e5fc; margin-bottom:1.2rem; }
.pop-btn {
  background:linear-gradient(135deg,#f9a825,#e65100);
  border:none; border-radius:50px; padding:.7rem 1.8rem;
  font-size:1.2rem; font-family:'Fredoka One',sans-serif; color:#fff; cursor:pointer;
}

/* ── WIN ── */
#win {
  position:fixed; inset:0; display:none; flex-direction:column;
  align-items:center; justify-content:center;
  background:linear-gradient(135deg,#1a237e,#0d47a1);
  z-index:60; color:#fff; text-align:center; padding:2rem;
}
#win h1 { font-size:3rem; color:#ffd54f; }
#win p  { font-size:1.1rem; color:#b3e5fc; margin:1rem 0 2rem; }

/* ── DRAG JOYSTICK (no gyro fallback) ── */
#joystick {
  position:fixed; right:1.2rem; bottom:5.5rem; z-index:15;
  width:80px; height:80px; border-radius:50%;
  background:rgba(255,255,255,.18); border:2px solid rgba(255,255,255,.4);
  display:flex; align-items:center; justify-content:center;
  color:#fff; font-size:.75rem; text-align:center; line-height:1.2;
  user-select:none;
}
</style>
</head>
<body>

<!-- CAMERA BACKGROUNDS -->
<video id="videoBg" autoplay playsinline muted></video>
<div id="noCamBg"></div>

<!-- VR SPLIT EYE PANELS -->
<div id="vrLeft"><video id="vrVidL" autoplay playsinline muted></video></div>
<div id="vrRight"><video id="vrVidR" autoplay playsinline muted></video></div>
<div id="vrDivider"></div>

<!-- 3D CANVAS -->
<canvas id="gameCanvas"></canvas>

<!-- LOADING SCREEN -->
<div id="loading">
  <div class="critters">🦒🐘🐵🦘🐻🐕🍎🥒</div>
  <h1>Safari AR!</h1>
  <p>Animals & giant fruits are hiding<br>all around your home 🏠</p>
  <p style="color:#ffd54f;font-size:.9rem">📱 Tap START then look around<br>with your phone camera!</p>
  <button id="startBtn" onclick="startGame()">▶ Start Adventure!</button>
  <p style="font-size:.75rem;color:#4a6fa0;margin-top:1rem">Allow camera access when asked</p>
</div>

<!-- HUD -->
<div id="hud">
  <div class="hud-pill">⭐ <span id="scoreVal">0</span></div>
  <div class="hud-pill" id="found-box">🔍 Look around!</div>
</div>

<!-- BOTTOM BAR -->
<div id="bottomBar">
  <button id="vrBtn" onclick="toggleVR()">📦 Cardboard</button>
  <span id="hint-text">👀 Move your phone to find creatures!</span>
  <button id="catchBtn" onclick="catchIt()">🤚 Catch!</button>
</div>

<!-- JOYSTICK hint (no gyro) -->
<div id="joystick" id="joystick">drag<br>to look</div>

<!-- POPUP -->
<div id="popup">
  <div id="popup-inner">
    <div id="popup-emoji">🦒</div>
    <div id="popup-name">Giraffe!</div>
    <div id="popup-msg"></div>
    <button class="pop-btn" onclick="closePopup()">Keep Looking! 🗺</button>
  </div>
</div>

<!-- WIN -->
<div id="win">
  <div style="font-size:4rem">🏆🎉🌟</div>
  <h1>You Won!</h1>
  <p id="win-msg"></p>
  <button class="pop-btn" onclick="resetGame()">Play Again 🔄</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ═══════════════════════════════════════════════════════════
// OBJECT DEFINITIONS
// ═══════════════════════════════════════════════════════════
const DEFS = [
  {id:'giraffe',  emoji:'🦒', name:'Giraffe',   color:0xF4A460, accent:0x8B5E3C, room:'living room',  pts:10},
  {id:'elephant', emoji:'🐘', name:'Elephant',   color:0x9E9E9E, accent:0x616161, room:'kitchen',      pts:10},
  {id:'monkey',   emoji:'🐵', name:'Monkey',     color:0x8D6E63, accent:0xF5CBA7, room:'bathroom',     pts:10},
  {id:'kangaroo', emoji:'🦘', name:'Kangaroo',   color:0xBC8A5F, accent:0x8B5E3C, room:'bedroom',      pts:10},
  {id:'winnie',   emoji:'🐻', name:'Winnie Pooh',color:0xDAA520, accent:0xCC2200, room:'hallway',      pts:10},
  {id:'chase',    emoji:'🐕', name:'Chase',      color:0xA0522D, accent:0x0000CC, room:'living room',  pts:10},
  {id:'skye',     emoji:'🦺', name:'Skye',       color:0xE8A0B0, accent:0xFF1493, room:'bedroom',      pts:10},
  {id:'apple',    emoji:'🍎', name:'Apple',      color:0xDD2222, accent:0x228B22, room:'on the sofa',  pts:5},
  {id:'orange',   emoji:'🍊', name:'Orange',     color:0xFF8C00, accent:0x228B22, room:'dining table', pts:5},
  {id:'tomato',   emoji:'🍅', name:'Tomato',     color:0xFF3E00, accent:0x228B22, room:'kitchen counter',pts:5},
  {id:'cucumber', emoji:'🥒', name:'Cucumber',   color:0x2E8B22, accent:0x1A5C14, room:'on the sofa',  pts:5},
  {id:'banana',   emoji:'🍌', name:'Banana',     color:0xFFE135, accent:0x9B8000, room:'bedroom',      pts:5},
];

// ═══════════════════════════════════════════════════════════
// THREE.JS GLOBALS
// ═══════════════════════════════════════════════════════════
let scene, renderer;
let camL, camR;   // left & right eye cameras (for VR)
let vrMode = false;
const objects3d = [];
let nearObj = null;
let score = 0;
const found = new Set();

// ═══════════════════════════════════════════════════════════
// ORIENTATION / LOOK DIRECTION
// ═══════════════════════════════════════════════════════════
let yaw = 0, pitch = 0;
let gyroAlpha = 0, gyroBeta = 90, gyroGamma = 0;
let hasGyro = false;
let touchX = 0, touchY = 0, dragging = false;

window.addEventListener('deviceorientation', e => {
  if (e.alpha != null) {
    gyroAlpha = e.alpha || 0;
    gyroBeta  = e.beta  || 90;
    gyroGamma = e.gamma || 0;
    hasGyro = true;
    document.getElementById('joystick').style.display = 'none';
  }
});

document.addEventListener('touchstart', e => {
  // ignore UI buttons
  if (e.target.tagName === 'BUTTON') return;
  touchX = e.touches[0].clientX;
  touchY = e.touches[0].clientY;
  dragging = true;
}, {passive:true});
document.addEventListener('touchmove', e => {
  if (!dragging || hasGyro) return;
  const dx = e.touches[0].clientX - touchX;
  const dy = e.touches[0].clientY - touchY;
  yaw   -= dx * 0.004;
  pitch -= dy * 0.003;
  pitch = Math.max(-1.1, Math.min(1.1, pitch));
  touchX = e.touches[0].clientX;
  touchY = e.touches[0].clientY;
}, {passive:true});
document.addEventListener('touchend', () => dragging = false, {passive:true});

// Also mouse for desktop testing
let mouseDown = false, mx = 0, my = 0;
document.addEventListener('mousedown', e => { mouseDown=true; mx=e.clientX; my=e.clientY; });
document.addEventListener('mouseup',   () => mouseDown=false);
document.addEventListener('mousemove', e => {
  if (!mouseDown) return;
  yaw   -= (e.clientX-mx)*0.004; pitch -= (e.clientY-my)*0.003;
  pitch = Math.max(-1.1,Math.min(1.1,pitch));
  mx=e.clientX; my=e.clientY;
});

// ═══════════════════════════════════════════════════════════
// BUILD SCENE
// ═══════════════════════════════════════════════════════════
function initThree() {
  scene = new THREE.Scene();

  // Two cameras for VR split
  camL = new THREE.PerspectiveCamera(65, window.innerWidth/window.innerHeight, 0.05, 120);
  camR = new THREE.PerspectiveCamera(65, (window.innerWidth/2)/window.innerHeight, 0.05, 120);
  camL.position.set(0, 1.5, 0);
  camR.position.set(0, 1.5, 0);

  renderer = new THREE.WebGLRenderer({
    canvas: document.getElementById('gameCanvas'),
    alpha: true, antialias: true
  });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setClearColor(0x000000, 0);
  renderer.autoClear = false;

  // Lights
  scene.add(new THREE.AmbientLight(0xffffff, 0.75));
  const sun = new THREE.DirectionalLight(0xfff5d0, 1.3);
  sun.position.set(4, 8, 5);
  scene.add(sun);
  const fill = new THREE.DirectionalLight(0xd0e8ff, 0.5);
  fill.position.set(-4, 3, -6);
  scene.add(fill);

  // Floor grid (visual reference)
  const gridHelper = new THREE.GridHelper(40, 40, 0x444466, 0x333355);
  gridHelper.position.y = -0.05;
  scene.add(gridHelper);

  spawnObjects();
  window.addEventListener('resize', onResize);
  animate();
}

// ═══════════════════════════════════════════════════════════
// SPAWN OBJECTS AROUND PLAYER
// ═══════════════════════════════════════════════════════════
function spawnObjects() {
  DEFS.forEach((def, i) => {
    const angle = (i / DEFS.length) * Math.PI * 2;
    // Vary distance 3–5 m so they're all easily visible
    const dist  = 3.5 + (i % 3) * 0.7;
    const x = Math.sin(angle) * dist;
    const z = Math.cos(angle) * dist;

    const group = buildCreature(def);
    group.position.set(x, 0, z);
    group.lookAt(0, group.position.y, 0); // face the player
    group.userData = { ...def };
    scene.add(group);
    objects3d.push(group);

    // Floating label above creature
    const lbl = makeLabel(def.emoji + ' ' + def.name);
    lbl.position.set(x, 1.9, z);
    lbl.userData = { isLabel: true };
    scene.add(lbl);
    group.userData.label = lbl;
  });
}

// ═══════════════════════════════════════════════════════════
// CREATURE BUILDER – proper 3D shapes ~1 m tall
// ═══════════════════════════════════════════════════════════
function mat(color) { return new THREE.MeshLambertMaterial({color}); }

function buildCreature(def) {
  const g = new THREE.Group();
  if (def.id === 'apple' || def.id === 'orange' || def.id === 'tomato')
    buildRoundFruit(g, def);
  else if (def.id === 'cucumber')
    buildCucumber(g, def);
  else if (def.id === 'banana')
    buildBanana(g, def);
  else if (def.id === 'giraffe')
    buildGiraffe(g, def);
  else if (def.id === 'elephant')
    buildElephant(g, def);
  else if (def.id === 'monkey')
    buildMonkey(g, def);
  else if (def.id === 'kangaroo')
    buildKangaroo(g, def);
  else if (def.id === 'winnie')
    buildWinnie(g, def);
  else
    buildDog(g, def);
  return g;
}

// ── helpers ──
function addSphere(g, color, rx, ry, rz, px, py, pz, rotX=0, rotZ=0) {
  const m = new THREE.Mesh(new THREE.SphereGeometry(1, 14, 12), mat(color));
  m.scale.set(rx, ry, rz);
  m.position.set(px, py, pz);
  m.rotation.x = rotX; m.rotation.z = rotZ;
  g.add(m); return m;
}
function addCyl(g, color, rt, rb, h, px, py, pz, rotX=0, rotZ=0, segs=8) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, segs), mat(color));
  m.position.set(px, py, pz);
  m.rotation.x = rotX; m.rotation.z = rotZ;
  g.add(m); return m;
}
function addCone(g, color, r, h, px, py, pz, rotX=0, rotZ=0) {
  const m = new THREE.Mesh(new THREE.ConeGeometry(r, h, 8), mat(color));
  m.position.set(px, py, pz); m.rotation.x=rotX; m.rotation.z=rotZ;
  g.add(m); return m;
}
function eyes(g, py, pz, hs=0.1) {
  [-hs, hs].forEach(x => {
    addSphere(g, 0xffffff,  0.055, 0.055, 0.04,  x, py, pz);
    addSphere(g, 0x111111,  0.03,  0.03,  0.03,  x*0.7, py, pz+0.025);
  });
}

// ── GIRAFFE ──
function buildGiraffe(g, d) {
  addCyl(g, d.color, .18,.22,.55,  0, .28, 0);          // body
  addCyl(g, d.color, .10,.14,.72,  0, .78, 0);          // neck
  addSphere(g, d.color, .22,.2,.2,  0,1.3,.08);          // head
  eyes(g, 1.34, .28, .09);
  // nostrils
  addSphere(g, d.accent, .04,.03,.02,  -.05,1.2,.3);
  addSphere(g, d.accent, .04,.03,.02,   .05,1.2,.3);
  // horns
  addCyl(g, d.accent, .02,.03,.14,  -.1,1.45,.0);
  addCyl(g, d.accent, .02,.03,.14,   .1,1.45,.0);
  // legs
  [-.16,.16].forEach(x => [-.12,.12].forEach(z => addCyl(g, d.color, .06,.055,.4, x,.2,z)));
  // spots on neck/body
  for(let i=0;i<9;i++) {
    const a = Math.random()*Math.PI*2, r=.2;
    addSphere(g, d.accent, .07,.06,.04, Math.cos(a)*r, .4+Math.random()*.9, Math.sin(a)*r);
  }
  // tail
  addCyl(g, d.color, .03,.02,.25, .0,.45,-.22, -.6);
}

// ── ELEPHANT ──
function buildElephant(g, d) {
  addSphere(g, d.color, .42,.38,.35,  0,.5,0);           // body
  addSphere(g, d.color, .3,.28,.28,   0,1.0,.2);          // head
  // big ears
  [-1,1].forEach(s => addSphere(g, d.accent, .12,.32,.05, s*.48,1.0,.08));
  // trunk
  addCyl(g, d.color, .07,.1,.5,  0,.72,.5, .9);
  // tusks
  [-1,1].forEach(s => addCyl(g, 0xFFFDE7, .04,.03,.28, s*.12,.78,.52, .4, s*.25));
  eyes(g, 1.06, .47);
  // legs
  [-.18,.18].forEach(x => [-.12,.12].forEach(z => addCyl(g, d.color, .09,.085,.35, x,.18,z)));
  // tail
  addCyl(g, d.color, .025,.02,.18, 0,.55,-.34, .5);
}

// ── MONKEY ──
function buildMonkey(g, d) {
  addSphere(g, d.color, .3,.3,.28,  0,.44,0);             // body
  addSphere(g, d.color, .22,.22,.2,  0,.86,.08);           // head
  addSphere(g, d.accent, .14,.1,.1,  0,.8,.24);            // muzzle
  // big ears
  [-1,1].forEach(s => addSphere(g, d.accent, .1,.1,.05, s*.28,.88,.04));
  eyes(g, .9, .28, .08);
  // arms
  [-1,1].forEach(s => {
    addCyl(g, d.color, .055,.05,.35, s*.32,.58,0, 0, s*.8);
    addSphere(g, d.color, .08,.07,.07, s*.55,.42,0);       // hand
  });
  // legs
  [-.1,.1].forEach(x => {
    addCyl(g, d.color, .065,.06,.32, x,.2,0);
    addSphere(g, d.color, .08,.065,.08, x,.04,0);          // foot
  });
  // tail
  for(let i=0;i<7;i++){
    const t=i/6;
    const m=new THREE.Mesh(new THREE.SphereGeometry(.05,8,8), mat(d.color));
    m.position.set(Math.sin(t*2.2)*.38-.15, .28+t*.45, -.28-t*.05);
    g.add(m);
  }
}

// ── KANGAROO ──
function buildKangaroo(g, d) {
  addSphere(g, d.color, .28,.42,.26,  0,.62,0);            // body (upright)
  addSphere(g, d.color, .22,.2,.18,   0,1.12,.1);           // head
  // ears
  [-1,1].forEach(s => addCone(g, d.color, .07,.2, s*.1,1.35,.08, 0,s*.15));
  eyes(g, 1.16, .26, .09);
  // short arms
  [-1,1].forEach(s => addCyl(g, d.color, .05,.045,.22, s*.28,.82,0, 0, s*.7));
  // big hind legs
  [-1,1].forEach(s => {
    addCyl(g, d.color, .09,.08,.48, s*.14,.3,0);
    addCyl(g, d.color, .065,.06,.32, s*.14,.06,.18, .5);   // foot
  });
  // pouch
  addSphere(g, d.accent, .18,.14,.1, 0,.56,.25);
  // baby in pouch
  addSphere(g, d.color, .09,.1,.09, 0,.68,.3);
  // tail
  addCyl(g, d.color, .07,.04,.45, 0,.45,-.3, -.5);
}

// ── WINNIE POOH ──
function buildWinnie(g, d) {
  addSphere(g, d.color, .38,.36,.34,  0,.5,0);             // chubby body
  addSphere(g, d.accent, .36,.34,.32, 0,.52,0.02);         // red shirt overlay
  addSphere(g, d.color, .28,.28,.26,  0,.98,.08);           // head
  // round ears
  [-1,1].forEach(s => addSphere(g, d.color, .12,.12,.1, s*.28,1.2,.04));
  // snout
  addSphere(g, 0xF5CBA7, .16,.12,.1, 0,.9,.28);
  addSphere(g, 0x333333, .04,.04,.03, 0,.94,.38);           // nose
  eyes(g, 1.0, .3, .1);
  // arms
  [-1,1].forEach(s => {
    addCyl(g, d.color, .07,.065,.3, s*.4,.66,0, 0, s*.7);
    addSphere(g, d.color, .1,.09,.09, s*.58,.54,0);
  });
  // legs
  [-.14,.14].forEach(x => {
    addCyl(g, d.color, .08,.075,.32, x,.2,0);
    addSphere(g, d.color, .1,.08,.12, x,.04,.05);
  });
}

// ── DOG (Chase / Skye) ──
function buildDog(g, d) {
  addSphere(g, d.color, .32,.28,.28,  0,.46,0);             // body
  addSphere(g, d.color, .24,.22,.22,  0,.88,.1);             // head
  // snout
  addSphere(g, d.id==='chase'?0xF5D5A0:0xF8C8C8, .13,.1,.1, 0,.82,.3);
  addSphere(g, 0x222222, .04,.04,.03, 0,.86,.42);            // nose
  // eyes
  eyes(g, .92, .32, .09);
  // floppy ears
  [-1,1].forEach(s => addSphere(g, d.id==='skye'?d.accent:d.color, .1,.18,.06, s*.26,.78,-.05, 0, s*.2));
  // collar
  const collar = new THREE.Mesh(new THREE.TorusGeometry(.22,.04,8,16), mat(d.accent));
  collar.rotation.x=Math.PI/2; collar.position.set(0,.72,.12); g.add(collar);
  // badge
  addCyl(g, 0xFFD700, .07,.07,.03, 0,.7,.34);
  // legs
  [-.14,.14].forEach(x => [-.1,.1].forEach(z => addCyl(g, d.color, .065,.06,.28, x,.18,z)));
  // tail
  addCyl(g, d.color, .04,.03,.22, 0,.58,-.3, -.7);
}

// ── ROUND FRUIT ──
function buildRoundFruit(g, d) {
  addSphere(g, d.color, .44,.44,.44,  0,.55,0);
  addCyl(g, 0x3B7A1A, .03,.025,.2,  0,1.0,0);              // stem
  addSphere(g, 0x3B7A1A, .12,.18,.06, .1,1.05,0, 0,-.4);   // leaf
  if (d.id==='tomato') {
    // extra leaves on top
    for(let i=0;i<5;i++){
      const a=i/5*Math.PI*2;
      addSphere(g,0x2A6B10,.1,.06,.03, Math.cos(a)*.12,.98,Math.sin(a)*.12, 0, a);
    }
  }
}

// ── CUCUMBER ──
function buildCucumber(g, d) {
  addCyl(g, d.color, .14,.12,.82, 0,.55,0, 0,0,12);
  // bumps
  for(let i=0;i<10;i++){
    const a=Math.random()*Math.PI*2, y=.2+Math.random()*.7;
    addSphere(g, d.accent, .04,.04,.04, Math.cos(a)*.15,y,Math.sin(a)*.15);
  }
  // ends
  addSphere(g, d.accent, .14,.06,.14, 0,1.0,0);
  addSphere(g, d.accent, .12,.05,.12, 0,.1,0);
  g.rotation.z = .25;  // lying slightly tilted
}

// ── BANANA ──
function buildBanana(g, d) {
  for(let i=0;i<10;i++){
    const t=i/9;
    const m=new THREE.Mesh(new THREE.SphereGeometry(.11-t*.02,10,8), mat(d.color));
    m.position.set(Math.sin(t*1.3)*.38, t*.75+.1, 0);
    m.scale.y=.7;
    g.add(m);
  }
  // tip
  addSphere(g, d.accent, .07,.07,.07, .46,.7,0);
  addCone(g, d.accent, .05,.1, .02,.84,0, 0,0);
  g.position.y=0; g.rotation.z=-.2;
}

// ═══════════════════════════════════════════════════════════
// FLOATING LABEL (canvas sprite)
// ═══════════════════════════════════════════════════════════
function makeLabel(text) {
  const c=document.createElement('canvas');
  c.width=280; c.height=72;
  const ctx=c.getContext('2d');
  ctx.fillStyle='rgba(0,0,0,.7)';
  ctx.beginPath();ctx.roundRect(4,4,272,64,16);ctx.fill();
  ctx.fillStyle='#fff';
  ctx.font='bold 34px Fredoka One,sans-serif';
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(text,140,38);
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),transparent:true}));
  sp.scale.set(1.6,.46,1);
  return sp;
}

// ═══════════════════════════════════════════════════════════
// CAMERA ORIENTATION
// ═══════════════════════════════════════════════════════════
const quat = new THREE.Quaternion();
const euler = new THREE.Euler(0,0,0,'YXZ');
const EYE_IPD = 0.032; // half interpupillary distance in metres

function applyCameraOrientation(cam) {
  if (hasGyro) {
    euler.set(
      THREE.MathUtils.degToRad(gyroBeta  - 90),
     -THREE.MathUtils.degToRad(gyroAlpha),
     -THREE.MathUtils.degToRad(gyroGamma),
      'YXZ'
    );
  } else {
    euler.set(pitch, yaw, 0, 'YXZ');
  }
  cam.quaternion.setFromEuler(euler);
}

// ═══════════════════════════════════════════════════════════
// FIND NEAREST VISIBLE OBJECT
// ═══════════════════════════════════════════════════════════
const camDir = new THREE.Vector3();
const toObj  = new THREE.Vector3();

function findNearest() {
  camL.getWorldDirection(camDir);
  let bestDot = 0.4, best = null;
  objects3d.forEach(o => {
    if (found.has(o.userData.id) || !o.visible) return;
    toObj.subVectors(o.position, camL.position);
    const dist = toObj.length();
    if (dist > 10) return;
    toObj.normalize();
    const dot = camDir.dot(toObj);
    const s = dot - dist * 0.04;
    if (s > bestDot) { bestDot = s; best = o; }
  });
  nearObj = best;
  const btn = document.getElementById('catchBtn');
  const hint = document.getElementById('hint-text');

  if (best) {
    const d = camL.position.distanceTo(best.position);
    btn.style.display = d < 3.0 ? 'block' : 'none';
    hint.textContent = `🎯 ${best.userData.name} is in the ${best.userData.room}!`;
  } else {
    btn.style.display = 'none';
    const rem = DEFS.filter(d => !found.has(d.id));
    if (rem.length) {
      const pick = rem[Math.floor(Date.now()/4000) % rem.length];
      hint.textContent = `🔍 Find the ${pick.name} in the ${pick.room}!`;
    } else {
      hint.textContent = '✅ All found!';
    }
  }
}

// ═══════════════════════════════════════════════════════════
// CATCH
// ═══════════════════════════════════════════════════════════
function catchIt() {
  if (!nearObj || found.has(nearObj.userData.id)) return;
  const def = nearObj.userData;
  found.add(def.id);
  score += def.pts;
  document.getElementById('scoreVal').textContent = score;

  // Pop animation
  const obj = nearObj;
  let t=0;
  const iv = setInterval(() => {
    t += 0.06;
    const s = 1 + t * .6;
    obj.scale.set(s,s,s);
    if (t >= 1) {
      clearInterval(iv);
      obj.visible = false;
      if(obj.userData.label) obj.userData.label.visible = false;
    }
  }, 20);

  // Update found box
  const emojis = [...found].map(id => DEFS.find(d=>d.id===id)?.emoji).join('');
  document.getElementById('found-box').textContent =
    emojis + '  ' + (DEFS.length - found.size) + ' left';

  // Show popup
  document.getElementById('popup-emoji').textContent = def.emoji;
  document.getElementById('popup-name').textContent  = def.name + '!';
  document.getElementById('popup-msg').textContent =
    `Found in the ${def.room}! +${def.pts} ⭐`;
  document.getElementById('popup').style.display = 'flex';
  document.getElementById('catchBtn').style.display = 'none';

  if (found.size >= DEFS.length) setTimeout(showWin, 1600);
}

function closePopup() { document.getElementById('popup').style.display = 'none'; }

function showWin() {
  closePopup();
  document.getElementById('win-msg').textContent =
    `All ${DEFS.length} creatures found! Total: ${score} ⭐`;
  document.getElementById('win').style.display = 'flex';
}

function resetGame() {
  found.clear(); score = 0;
  document.getElementById('scoreVal').textContent = '0';
  document.getElementById('found-box').textContent = '🔍 Look around!';
  document.getElementById('win').style.display = 'none';
  objects3d.forEach(o => {
    o.visible = true; o.scale.set(1,1,1);
    if(o.userData.label) o.userData.label.visible = true;
  });
}

// ═══════════════════════════════════════════════════════════
// VR TOGGLE
// ═══════════════════════════════════════════════════════════
function toggleVR() {
  vrMode = !vrMode;
  document.body.classList.toggle('vr-mode', vrMode);
  document.getElementById('vrBtn').textContent = vrMode ? '📱 Normal' : '📦 Cardboard';

  if (vrMode) {
    // Mirror the same stream to right panel video
    const stream = document.getElementById('videoBg').srcObject;
    if (stream) {
      document.getElementById('vrVidL').srcObject = stream;
      document.getElementById('vrVidR').srcObject = stream;
    }
    renderer.setSize(window.innerWidth, window.innerHeight);
  } else {
    renderer.setSize(window.innerWidth, window.innerHeight);
  }
  onResize();
}

// ═══════════════════════════════════════════════════════════
// ANIMATE
// ═══════════════════════════════════════════════════════════
let frame = 0;
function animate() {
  requestAnimationFrame(animate);
  frame++;

  // Bob and slow spin
  objects3d.forEach((o,i) => {
    if (!o.visible) return;
    o.position.y = Math.sin(frame * 0.025 + i * 1.1) * 0.07;
    o.rotation.y += 0.008;
  });

  applyCameraOrientation(camL);
  if (frame % 8 === 0) findNearest();

  renderer.clear();

  if (vrMode) {
    const W = window.innerWidth, H = window.innerHeight;
    // Left eye
    camR.position.copy(camL.position).addScaledVector(
      new THREE.Vector3().setFromMatrixColumn(camL.matrixWorld, 0), -EYE_IPD);
    camL.position.set(0,1.5,0);
    camL.aspect = (W/2) / H;
    camL.updateProjectionMatrix();
    renderer.setViewport(0, 0, W/2, H);
    renderer.setScissor(0, 0, W/2, H);
    renderer.setScissorTest(true);
    renderer.render(scene, camL);

    // Right eye (slight offset)
    camR.quaternion.copy(camL.quaternion);
    camR.position.set(EYE_IPD*2, 1.5, 0);
    camR.aspect = (W/2) / H;
    camR.updateProjectionMatrix();
    renderer.setViewport(W/2, 0, W/2, H);
    renderer.setScissor(W/2, 0, W/2, H);
    renderer.render(scene, camR);

    renderer.setScissorTest(false);
  } else {
    camL.position.set(0, 1.5, 0);
    camL.aspect = window.innerWidth / window.innerHeight;
    camL.updateProjectionMatrix();
    renderer.setViewport(0, 0, window.innerWidth, window.innerHeight);
    renderer.render(scene, camL);
  }
}

function onResize() {
  const W = window.innerWidth, H = window.innerHeight;
  renderer.setSize(W, H);
  if (!vrMode) {
    camL.aspect = W/H;
    camL.updateProjectionMatrix();
  }
}

// ═══════════════════════════════════════════════════════════
// START
// ═══════════════════════════════════════════════════════════
async function startGame() {
  document.getElementById('loading').style.display = 'none';

  // ── Camera stream ──
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment', width: {ideal:1280}, height: {ideal:720} },
      audio: false
    });
    const vid = document.getElementById('videoBg');
    vid.srcObject = stream;
    await vid.play().catch(()=>{});
  } catch(e) {
    console.warn('Camera not available:', e);
    document.getElementById('noCamBg').style.display = 'block';
  }

  // ── iOS gyro permission ──
  if (typeof DeviceOrientationEvent !== 'undefined' &&
      typeof DeviceOrientationEvent.requestPermission === 'function') {
    try { await DeviceOrientationEvent.requestPermission(); } catch(e) {}
  }

  initThree();

  // Show drag hint if no gyro after 2s
  setTimeout(() => {
    if (!hasGyro) {
      document.getElementById('hint-text').textContent =
        '↔ Drag screen to look around!';
    }
  }, 2000);
}
